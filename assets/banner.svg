<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f8fb"/><stop offset="1" stop-color="#e8eef7"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#1e3a5f" flood-opacity="0.14"/>
    </filter>
  </defs>
  <rect width="1280" height="420" rx="24" fill="url(#bg)"/>

  <!-- Left: title -->
  <text x="72" y="118" font-size="22" fill="#5b7aa3" font-weight="600" letter-spacing="2">EMAIL CASE FILE</text>
  <text x="72" y="188" font-size="58" fill="#14263f" font-weight="800">Email 案卷整理</text>
  <text x="72" y="244" font-size="26" fill="#3d5677">一資料夾的信，變成一份</text>
  <text x="72" y="282" font-size="26" fill="#3d5677">「這個案子現在走到哪」的報告</text>
  <g font-size="18" font-weight="600">
    <rect x="72" y="318" width="118" height="38" rx="19" fill="#dbe7f7"/><text x="131" y="343" text-anchor="middle" fill="#24508a">誰決定的</text>
    <rect x="202" y="318" width="118" height="38" rx="19" fill="#dbe7f7"/><text x="261" y="343" text-anchor="middle" fill="#24508a">哪天定的</text>
    <rect x="332" y="318" width="118" height="38" rx="19" fill="#dbe7f7"/><text x="391" y="343" text-anchor="middle" fill="#24508a">還在等誰</text>
    <rect x="462" y="318" width="118" height="38" rx="19" fill="#ffe6cc"/><text x="521" y="343" text-anchor="middle" fill="#a04f00">原文為證</text>
  </g>

  <!-- Middle: messy emails -->
  <g filter="url(#sh)">
    <g transform="rotate(-9 735 170)"><rect x="672" y="120" width="130" height="86" rx="10" fill="#fff"/><rect x="688" y="138" width="70" height="8" rx="4" fill="#c9d4e3"/><rect x="688" y="156" width="96" height="6" rx="3" fill="#e2e8f0"/><rect x="688" y="170" width="84" height="6" rx="3" fill="#e2e8f0"/></g>
    <g transform="rotate(7 745 250)"><rect x="680" y="208" width="130" height="86" rx="10" fill="#fff"/><rect x="696" y="226" width="60" height="8" rx="4" fill="#c9d4e3"/><rect x="696" y="244" width="96" height="6" rx="3" fill="#e2e8f0"/><rect x="696" y="258" width="70" height="6" rx="3" fill="#e2e8f0"/></g>
    <g transform="rotate(-4 730 320)"><rect x="664" y="282" width="130" height="86" rx="10" fill="#fff"/><rect x="680" y="300" width="80" height="8" rx="4" fill="#c9d4e3"/><rect x="680" y="318" width="96" height="6" rx="3" fill="#e2e8f0"/><rect x="680" y="332" width="60" height="6" rx="3" fill="#e2e8f0"/></g>
  </g>
  <text x="737" y="402" text-anchor="middle" font-size="15" fill="#7a8ca5">.msg · .eml · .pst</text>

  <!-- Arrow -->
  <path d="M842 238 H900" stroke="#5b7aa3" stroke-width="5" stroke-linecap="round"/>
  <path d="M890 224 L908 238 L890 252" fill="none" stroke="#5b7aa3" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Right: report card -->
  <g filter="url(#sh)">
    <rect x="936" y="62" width="288" height="320" rx="16" fill="#fff"/>
    <rect x="936" y="62" width="288" height="52" rx="16" fill="#24508a"/><rect x="936" y="96" width="288" height="18" fill="#24508a"/>
    <text x="958" y="96" font-size="19" fill="#fff" font-weight="700">案卷整理_2026-11-06</text>
    <g font-size="15">
      <circle cx="964" cy="144" r="8" fill="#2e9e5b"/><text x="980" y="149" fill="#14263f" font-weight="700">已決策</text><text x="1050" y="149" fill="#5f6f85">B 方案 · John · 9/5</text>
      <circle cx="964" cy="186" r="8" fill="#e0912b"/><text x="980" y="191" fill="#14263f" font-weight="700">未決</text><text x="1050" y="191" fill="#5f6f85">外箱加高？ 已等 18 天</text>
      <circle cx="964" cy="228" r="8" fill="#3b7dd8"/><text x="980" y="233" fill="#14263f" font-weight="700">待辦</text><text x="1050" y="233" fill="#5f6f85">寄打樣 2 台 · 9/30</text>
      <circle cx="964" cy="270" r="8" fill="#8a97a8"/><text x="980" y="275" fill="#14263f" font-weight="700">數字</text><text x="1050" y="275" fill="#5f6f85">48,000 → 24,000</text>
    </g>
    <rect x="958" y="300" width="244" height="1.5" fill="#e2e8f0"/>
    <g fill="#e8eef7"><rect x="958" y="316" width="200" height="8" rx="4"/><rect x="958" y="334" width="160" height="8" rx="4"/><rect x="958" y="352" width="180" height="8" rx="4"/></g>
  </g>
</svg>
